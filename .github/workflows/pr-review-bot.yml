name: PR Review Bot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel a stale run if new commits land on the same PR while this is running.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── Job 1: lint + typecheck (frontend) + syntax check (backend) ──────────────
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint (frontend)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (frontend)
        working-directory: frontend
        run: npm run typecheck

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Syntax-check backend modules
        run: python -m py_compile backend/app/*.py backend/app/pillars/*.py

  # ── Job 2: build the frontend, verify the build artifacts are intact ─────────
  artifact-scan:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build (production)
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify build artifacts are intact
        run: python scripts/verify_artifacts.py --dir frontend/.next

  # ── Job 3: run both test suites, compare against the main-branch baseline ────
  regression-tests:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    # Postgres service container: tests/test_houses.py, test_department_tags.py,
    # test_feed_ranking.py, and test_auth_security.py are live-DB integration
    # tests that each pytest.skip(allow_module_level=True) whenever POSTGRES_URL
    # isn't set — which, before this container was added, was ALWAYS true in
    # CI. That meant 92 of this repo's 112 local tests silently never ran here
    # at all; only test_decision_engine.py's 14 pure-logic tests did, and the
    # job still reported a clean "X passed, 3 skipped" that looked like a
    # correctly-configured pass rather than a coverage gap. Found while adding
    # the security-scan job below (this repo's Explore agent's audit of the
    # exact current pipeline shape flagged it) and fixed in the same PR since
    # it's directly adjacent — a security-scan gate is only as useful as the
    # regression suite it sits beside actually exercising the real code paths.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: video_moderation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: redactor123
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL: postgresql://postgres:redactor123@localhost:5434/video_moderation
      JWT_SECRET: ci-test-secret-not-used-in-prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          mkdir -p results
          python -m pytest tests/ -v --junitxml=results/backend.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npx vitest run --reporter=junit --outputFile=../results/frontend.xml

      - name: Compare against baseline
        run: python scripts/compare_baseline.py --results results/ --baseline .ci/baseline-results.json

  # ── Job 4: SAST + dependency-CVE scan, against a reviewed baseline ────────────
  # Security agent, Phase 1 of the security hardening plan. Same "needs:
  # lint-typecheck" pattern as artifact-scan/regression-tests — runs in
  # parallel with both. Blocks only on NEW findings above --min-severity
  # (default: high) that aren't already in .ci/security-baseline.json — a
  # deliberately-reviewed acceptance record (see that file's own entries for
  # why each pre-existing finding is or isn't currently exploitable in this
  # app), never auto-generated. This mirrors compare_baseline.py's own
  # "block only on new regressions" philosophy for the test suite: a repo
  # this size already has real pre-existing findings (confirmed on the PR
  # that introduced this job — 2 low-confidence bandit false-positives,
  # several transitive dependency CVEs), and a gate that blocked on
  # everything on day one would be permanently red rather than useful.
  #
  # gitleaks (content-based secret scanning, not just scan-repo.py's
  # existing filename-pattern check) is intentionally NOT included yet — it
  # needs its own GitHub App/license setup this environment can't provision;
  # tracked as a follow-up, not silently dropped.
  security-scan:
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps + security scanners
        run: |
          pip install -r backend/requirements.txt bandit pip-audit

      - name: Python SAST (bandit)
        run: |
          mkdir -p results
          bandit -r backend/app -ll -f json -o results/bandit.json
        continue-on-error: true  # findings are evaluated by security_gate.py below, not bandit's own exit code

      - name: Python dependency CVE scan (pip-audit)
        run: pip-audit -r backend/requirements.txt --format json --output results/pip-audit.json
        continue-on-error: true  # same — security_gate.py is the single source of pass/fail

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: JS dependency CVE scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high --json > ../results/npm-audit.json
        continue-on-error: true  # same — security_gate.py is the single source of pass/fail

      - name: Evaluate findings against the reviewed baseline
        run: python scripts/security_gate.py --results results/ --baseline .ci/security-baseline.json

  # ── Job 5: decision — merge only if every job above reported success ─────────
  decision:
    runs-on: ubuntu-latest
    needs: [lint-typecheck, artifact-scan, regression-tests, security-scan]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Evaluate gates and merge if green
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
        run: |
          python scripts/review_bot.py \
            --pr ${{ github.event.pull_request.number }} \
            --check lint-typecheck=${{ needs.lint-typecheck.result }} \
            --check artifact-scan=${{ needs.artifact-scan.result }} \
            --check regression-tests=${{ needs.regression-tests.result }} \
            --check security-scan=${{ needs.security-scan.result }}
